name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MOON_WORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn --target all
      - name: moon fmt (no diff)
        run: moon fmt --check
      - name: Check generated interfaces
        run: |
          moon info --target all
          git diff --exit-code
      - name: Test supported backends
        run: |
          moon test --target all
          moon test --target all --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Test live and exported dashboards
        run: npm run test:dashboard
